name: Expire stale booking holds

# Releases bookings whose approval/payment window has run out (marks them
# BOOKING_FAILED) by calling the app's expire-stale endpoint. GitHub's cron has a
# 5-minute minimum and can run a few minutes late, which is fine here: the
# availability engine already treats an expired hold as free, so this only
# keeps the stored status tidy.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-stale
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "ADMIN_API_KEY secret is not set in GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "x-admin-key: $ADMIN_API_KEY" \
            https://lively-grass-0137fc300.3.azurestaticapps.net/api/bookings/expire-stale
